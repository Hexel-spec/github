<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <div class="container">
            <img src="images/grover_map_scan.png" alt="map of grover hot springs state park" id="map" class="showing">

            <img class="thumbnail" id="hotspring_thumb" src="images/grover_hot_springs_thumb.jpeg" alt="hot spring" width="80">
            <img class="thumbnail" id="lake_thumb" src="images/burnside_lake_thumb.jpeg" alt="burnside lake" height="80">
            <img class="thumbnail" id="waterfall_thumb" src="images/grover_waterfall_thumb.jpeg" alt="waterfall" width="80">
            <img class="thumbnail" id="forest_thumb" src="images/burnt_forest_thumb.jpeg" alt="burnt forest" height="80">
            <img class="thumbnail" id="spring_thumb" src="images/secret_spring_thumb.jpeg" alt="secret spring" width="80">

            <img src="images/hot_spring.png" alt="hot spring" id="hot" class="hidden">
            <img src="images/lake.png" alt="burnside lake" id="lake" class="hidden">
            <img src="images/waterfall.png" alt="waterfall" id="waterfall" class="hidden">
            <img src="images/forest.png" alt="forest" id="forest" class="hidden">
            <img src="images/secret_spring.png" alt="secret spring" id="spring" class="hidden">

            <button id="close" class="hidden">x</button>


            <article>
                <h1>Grover Hot Springs State Park</h1>
                <p id="message">Click on a location to feel my experience.</p>
            </article>
            
        </div>
    </main>
    
</body>
</html>
