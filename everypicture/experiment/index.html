<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimentation</title>

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Experimentation</h1>

    <!-- Overlay on map -->
    <section >
        <!-- <h2>Overlay on Map</h2> -->
        <div id="map-overlay">
            <img id="map" src="images/grover_map.jpeg" alt="grover map" height="600">
            <img class="thumbnail" id="hotspring" src="images/grover_hot_springs.jpeg" alt="hot spring" width="50">
            <img class="thumbnail" id="lake" src="images/burnside_lake.jpeg" alt="burnside lake" height="50">
            <img class="thumbnail" id="waterfall" src="images/grover_waterfall.jpeg" alt="waterfall" width="50">
            <img class="thumbnail" id="forest" src="images/burnt_forest.jpeg" alt="burnt forest" height="50">
            <img class="thumbnail" id="spring" src="images/secret_spring.jpeg" alt="secret spring" width="50">
        </div>
        
    </section>

    <section id="ol-hotspring" class="overlay hidden">
        <article>
            <h3>Hot Spring</h3>
            <div id="hotZoom">
                <img src="images/grover_hot_springs.jpeg" alt="hot spring">
            </div>
            <button class="close">x</button>
            
        </article>
    </section>

    <section id="ol-lake" class="overlay hidden">
        <article>
            <h3>Burnside Lake</h3>
            <div>
                <img src="images/burnside_lake.jpeg" alt="burnside lake">
            </div>
            <button class="close">x</button>
            
        </article>
    </section>

    <section id="ol-waterfall" class="overlay hidden">
        <article>
            <h3>Waterfall</h3>
            <div>
                <img src="images/grover_waterfall.jpeg" alt="waterfall">
            </div>
            <button class="close">x</button>
            
        </article>
    </section>

    <section id="ol-forest" class="overlay hidden">
        <article>
            <h3>Burnt Forest</h3>
            <div>
                <img src="images/burnt_forest.jpeg" alt="burnt forest">
            </div>
            <button class="close">x</button>
            
        </article>
    </section>
    
    <section id="ol-spring" class="overlay hidden">
        <article>
            <h3>Secret Spring</h3>
            <div>
                <img src="images/secret_spring.jpeg" alt="secret spring">
            </div>
            <button class="close">x</button>
            
        </article>
    </section>

</body>
</html>
