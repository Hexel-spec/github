<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On! V1</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chilanka&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    
    <main>   
        <header>
            <h1>RO SHAM BO!</h1>
        </header>

        <div id="overlay" class="hidden">
            <h1>Round 1</h1>
        </div>

        <!-- <img src="images/rock.PNG" alt="rock" height="120"> -->

        <div id="container">
            <section id="side1">
                <div class="health">
                    <h2>Player 1</h2>
                    <div id="healthbar1"><div></div></div>
                    <p id="playerhealth1">100%</p>
                </div>
                <form id="player1form">
                    <fieldset>
                        <input type="radio" id="rock1-1" name="select1-1" value="rock" required>
                        <label for="rock1-1"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper1-1" name="select1-1" value="paper">
                        <label for="paper1-1"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors1-1" name="select1-1" value="scissors">
                        <label for="scissors1-1"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>

                    <fieldset>
                        <input type="radio" id="rock1-2" name="select1-2" value="rock" required>
                        <label for="rock1-2"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper1-2" name="select1-2" value="paper">
                        <label for="paper1-2"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors1-2" name="select1-2" value="scissors">
                        <label for="scissors1-2"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>
                    
                    <fieldset>
                        <input type="radio" class="rock" id="rock1-3" name="select1-3" value="rock" required>
                        <label for="rock1-3"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper1-3" name="select1-3" value="paper">
                        <label for="paper1-3"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors1-3" name="select1-3" value="scissors">
                        <label for="scissors1-3"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>

                    <input type="submit" id="finish1" name="finishsetup" value="Finish Setup">
                </form>

                <section class="cardselections">
                    <div><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                    <div><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                    <div><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                </section>
                
            </section>

            <section id="side2">
                <section class="cardselections">
                    <div id="2-1"><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                    <div id="2-2"><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                    <div id="2-3"><img src="images/roshambo_pattern.png" alt="cardback" width="480"></div>
                </section>

                <form id="player2form" class="hidden">
                    <fieldset>
                        <input type="radio" id="rock2-1" name="select2-1" value="rock" required>
                        <label for="rock2-1"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper2-1" name="select2-1" value="paper">
                        <label for="paper2-1"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors2-1" name="select2-1" value="scissors">
                        <label for="scissors2-1"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>

                    <fieldset>
                        <input type="radio" id="rock2-2" name="select2-2" value="rock" required>
                        <label for="rock2-2"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper2-2" name="select2-2" value="paper">
                        <label for="paper2-2"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors2-2" name="select2-2" value="scissors">
                        <label for="scissors2-2"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>
                    
                    <fieldset>
                        <input type="radio" id="rock2-3" name="select2-3" value="rock" required>
                        <label for="rock2-3"><img src="images/rock.PNG" alt="rock" width="40"></label>

                        <input type="radio" id="paper2-3" name="select2-3" value="paper">
                        <label for="paper2-3"><img src="images/paper.PNG" alt="paper" width="40"></label>
                        
                        <input type="radio" id="scissors2-3" name="select2-3" value="scissors">
                        <label for="scissors2-3"><img src="images/scissors.PNG" alt="scissors" width="40"></label>
                    </fieldset>

                    <input type="submit" id="finish2" name="finishsetup" value="Finish Setup">
                </form>

                <div class="health">
                    <h2>Player 2</h2>
                    <div id="healthbar2"><div></div></div><p id="playerhealth2">100%</p>
                </div>

            </section>
            <div id="textbox" class="hidden">
                <p>Game Start!</p>
            </div>

            <div id="gamebtns">
                <button type="button" id="nextround" class="hidden">Next Round</button>
                <button type="button" id="quitgame" class="hidden">Quit Game</button>
            </div>

        </div>
    </main>
    
</body>
</html>
